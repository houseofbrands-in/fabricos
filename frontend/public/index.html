<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1a1a2e" />
  <title>FabricOS — Factory Floor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    /* ── phone layout (desktop unchanged) ── */
    @media (max-width: 700px) {
      .fx-stack { grid-template-columns: 1fr !important; }
      .fx-stack > * { min-width: 0; }
      .fx-2up { grid-template-columns: 1fr 1fr !important; }
      .fx-hide-phone { display: none !important; }
      /* table rows become small cards: label above each value, wide cells take a full line */
      .fx-rows { min-width: 0 !important; }
      .fx-rows thead { display: none; }
      .fx-rows tr { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: end; gap: 0 8px; padding: 8px 0; }
      .fx-rows td { padding: 4px 6px !important; width: auto !important; }
      .fx-rows td[data-label]::before { content: attr(data-label); display: block; font-size: 11px; font-weight: 700; color: #6c757d; margin-bottom: 2px; }
      .fx-rows td.fx-full { grid-column: 1 / -1; }
      .fx-rows td input, .fx-rows td select { width: 100% !important; min-width: 0 !important; }
    }
    @media (min-width: 701px) {
      .fx-only-phone { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
